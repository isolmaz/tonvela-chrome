name: Release

# Every push to main runs CI. When extension/manifest.json has a version without
# a GitHub release, the extension ZIP is uploaded to the Chrome Web Store and
# submitted for review (it goes live once review passes), then released here as
# v<version>. Needs the secrets CWS_SERVICE_ACCOUNT_KEY and CWS_PUBLISHER_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version extension/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; bump the version to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.new == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Release notes
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::CHANGELOG.md has no '## $VERSION ' section"; exit 1; }
      # Checks versions, manifest and file references, then writes dist/Tonvela-Chrome-v<version>.zip and dist/Tonvela-Chrome.zip.
      - run: python3 tools/package.py --skip-browser-tests
      - name: Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: hionjhaedpahfidncfeainedjcdkfecn
        run: node tools/publish-cws.mjs "dist/Tonvela-Chrome-v$VERSION.zip" "$VERSION"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v$VERSION" "dist/Tonvela-Chrome-v$VERSION.zip" dist/Tonvela-Chrome.zip --target "$GITHUB_SHA" --title "Tonvela $VERSION" --notes-file notes.md
