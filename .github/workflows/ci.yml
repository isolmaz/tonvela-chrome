name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: skips the "prepare" script that installs the local pre-push hook.
      - run: npm ci --ignore-scripts
      - run: npm run check # eslint + node --test
