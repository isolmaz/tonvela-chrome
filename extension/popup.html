<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tonvela</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="wave" viewBox="0 0 24 24"><path d="M4 10v4m4-8v12m4-15v18m4-15v12m4-8v4"/></symbol>
    <symbol id="sliders" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16M8 5v6m8 2v6"/></symbol>
    <symbol id="voice" viewBox="0 0 24 24"><path d="M9 6a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0zm-3 6a6 6 0 0 0 12 0M12 18v3m-3 0h6"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></symbol>
    <symbol id="music" viewBox="0 0 24 24"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Zm8-1v4m-2-2h4"/></symbol>
    <symbol id="speaker" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6m2.5-8.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="speaker-off" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4zM16 9l5 6m0-6-5 6"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12Z"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="external" viewBox="0 0 24 24"><path d="M8 16 16 8m-6 0h6v6"/></symbol>
  </svg>
  <main>
    <div class="notices">
      <div id="error" class="notice error" role="alert" hidden></div>
      <div id="feedback" class="notice feedback" role="status" hidden><span id="feedback-text"></span><button id="undo" class="link" type="button" data-i18n="undo" hidden></button></div>
    </div>
    <section id="main-view" class="view">
      <header class="bar">
        <h1>Tonvela</h1>
        <span id="site" data-i18n="loadingTab"></span>
        <button id="open-settings" class="icon-button" type="button" data-i18n-attr="aria-label:settings title:settings"><svg><use href="#gear"/></svg></button>
      </header>
      <div class="hero">
        <div class="volume-value"><output id="volume-value">100</output><span>%</span></div>
        <p id="status-text" role="status"></p>
      </div>
      <div id="volume" class="volume" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="400" aria-valuenow="100" data-i18n-attr="aria-label:volumeLabel">
        <div id="volume-fill" class="volume-fill"></div>
        <svg class="volume-icon" aria-hidden="true"><use id="volume-icon" href="#speaker"/></svg>
      </div>
      <div id="presets" class="segmented"></div>
      <div class="group">
        <button id="open-modes" class="row link-row" type="button">
          <span class="row-label"><svg class="accent-icon"><use id="mode-icon" href="#wave"/></svg><span data-i18n="modeLabel"></span></span>
          <span class="row-value"><span id="mode-name"></span><svg class="flip"><use href="#chevron"/></svg></span>
        </button>
      </div>
      <div class="footer"><button id="original" class="link" type="button" data-i18n="originalSound"></button></div>
    </section>

    <section id="modes-view" class="view" hidden>
      <header class="bar nav">
        <button class="back link" type="button" data-back><svg class="flip"><use href="#back"/></svg><span data-i18n="back"></span></button>
        <h2 data-i18n="modeLabel"></h2>
      </header>
      <div id="modes" class="group" role="radiogroup" data-i18n-attr="aria-label:modeLabel"></div>
      <section id="target-panel" class="target" data-i18n-attr="aria-label:targetLabel">
        <div class="target-head"><label for="target" data-i18n="targetLabel"></label><button id="learn" class="link" type="button" data-i18n-attr="title:learnTitle"><span data-i18n="learnButton"></span></button></div>
        <input id="target" class="range" type="range" min="-48" max="-6" step="1" value="-22">
        <div class="captions"><span data-i18n="targetCalmer"></span><span id="target-value" dir="ltr"></span><span data-i18n="targetLouder"></span></div>
      </section>
    </section>

    <section id="settings-view" class="view" hidden>
      <header class="bar nav">
        <button class="back link" type="button" data-back><svg class="flip"><use href="#back"/></svg><span data-i18n="back"></span></button>
        <h2 data-i18n="settings"></h2>
      </header>
      <h3 data-i18n="outputGroup"></h3>
      <div class="group">
        <div class="row"><label for="output-device" data-i18n="outputDevice"></label><select id="output-device"><option value="" data-i18n="defaultDevice"></option></select></div>
        <label class="row"><span data-i18n="monoLabel"></span><span class="toggle"><input id="mono" type="checkbox" role="switch"><span aria-hidden="true"></span></span></label>
        <div class="row stacked">
          <div class="row-head"><label for="balance" data-i18n="balanceLabel"></label><button id="balance-center" class="link" type="button" data-i18n="center"></button></div>
          <div class="balance" dir="ltr"><span data-i18n="balanceLeft"></span><input id="balance" class="range" type="range" min="-100" max="100" step="5" value="0"><span data-i18n="balanceRight"></span></div>
        </div>
        <div class="row stacked">
          <span id="protection-label" data-i18n="protectionLabel"></span>
          <div id="protection" class="segmented inset" role="radiogroup" aria-labelledby="protection-label"></div>
        </div>
      </div>
      <p class="hint"><span data-i18n="outputHint"></span> <button id="device-names" class="link" type="button" data-i18n="showDeviceNames" hidden></button></p>
      <h3 data-i18n="generalGroup"></h3>
      <div class="group">
        <label class="row"><span data-i18n="rememberSites"></span><span class="toggle"><input id="remember" type="checkbox" role="switch"><span aria-hidden="true"></span></span></label>
        <div class="row"><label for="theme" data-i18n="themeLabel"></label><select id="theme"><option value="system" data-i18n="themeSystem"></option><option value="light" data-i18n="themeLight"></option><option value="dark" data-i18n="themeDark"></option></select></div>
        <div class="row"><label for="language" data-i18n="languageLabel"></label><select id="language"></select></div>
      </div>
      <div class="group">
        <button id="shortcuts" class="row link-row" type="button"><span data-i18n="shortcuts"></span><svg class="muted-icon"><use href="#external"/></svg></button>
        <button id="help" class="row link-row" type="button"><span data-i18n="help"></span><svg class="muted-icon"><use href="#external"/></svg></button>
      </div>
      <p class="hint" data-i18n="localNote"></p>
    </section>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
